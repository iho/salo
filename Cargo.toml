[package]
name = "salo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
bytes = "1.12.1"
encoding_rs = "0.8.41"
futures-util = "0.3.34"
librqbit = "9.0.1"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["query", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
torrent-name-parser = "0.12.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Smaller binary and slightly fewer resident code pages (real effect on
# RSS is modest -- this mostly trims disk/mmap size, not heap usage, but
# it's free and matches "single small binary" over "fastest build").
# Deliberately NOT panic = "abort": tokio isolates a panicking request
# handler to that one task via unwinding, turning it into a 500 instead of
# killing the whole server -- abort would remove that safety net entirely.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
