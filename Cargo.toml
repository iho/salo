[package]
name = "arrmonolith"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.34"
librqbit = "9.0.1"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
