<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SALO</title>
  <script src="/htmx.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    form.search { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    form.search input[type="text"] { flex: 1; padding: 0.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
    th a { color: inherit; text-decoration: none; }
    th a:hover { text-decoration: underline; }
    .htmx-indicator { display: none; opacity: 0.6; }
    .htmx-request .htmx-indicator { display: inline; }
    video { width: 100%; margin-bottom: 1.5rem; background: #000; }
    .pagination { display: flex; gap: 1rem; align-items: center; margin-top: 1rem; }
    form.open-form { display: flex; gap: 0.3rem; }
    form.open-form input[type="text"] { width: 8rem; }
    form.open-form input[type="number"] { width: 4.5rem; }
  </style>
</head>
<body>
  <p><a href="/torrents">Torrents</a> &middot; <a href="/settings">Settings</a></p>
  <h1>SALO</h1>

  <form class="search" hx-get="/search" hx-target="#results" hx-swap="innerHTML" hx-push-url="true">
    <input type="text" name="q" placeholder="Search for a release..." value="{{ query }}" required>
    <select name="tracker">
      <option value="all" {% if selected_tracker == "all" %}selected{% endif %}>All trackers</option>
      {% for t in trackers %}
        <option value="{{ t }}" {% if selected_tracker.as_str() == *t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
    <button type="submit">Search</button>
    <span class="htmx-indicator">searching…</span>
  </form>

  <div id="player"></div>
  <div id="results">{{ results_html|safe }}</div>
</body>
</html>
